# Rockchip RK3588 octa core 8-32GB SoC 4x2.5GBe eMMC USB3 NVMe SATA
BOARD_NAME="EasePi-R2"
BOARD_VENDOR="EasePi"
BOARDFAMILY="rockchip-rk3588"
MAINTAINER="Ifroncy"
MAINTAINERMAIL="j.s.q@qq.com"
VENDORSUPPORT="https://armbian.cn/"
INTRODUCED="2026"
BOOTCONFIG="easepi-r2-rk3588_defconfig"
KERNEL_TARGET="current,edge,vendor"
KERNEL_TEST_TARGET="current,vendor"
FULL_DESKTOP="yes"
BOOT_LOGO="desktop"
BOOT_FDT_FILE="rockchip/rk3588-easepi-r2.dtb"
BOOT_SCENARIO="spl-blobs"
BOOT_SUPPORT_SPI="no"
BOOT_SPI_RKSPI_LOADER="no"
BOOTFS_TYPE=fat
BOOTSIZE=256
IMAGE_PARTITION_TABLE="gpt"
#OVERLAY_DISABLE_AUTOPATCH="yes"
BOOT_SCRIPT="boot-rk35xx.cmd"
BOOT_ENV_FILE="armbianEnv.txt"
# OP-TEE configuration for RK3588 - temporarily disabled
# BL32_BLOB="rk35/rk3588_bl32_v1.20.bin"
# TEE_BLOB="rk35/rk3588_bl32_v1.20.bin"

# Optional IR + Bluetooth support for EasePi-R2.
# Disable temporarily with:
#   EASEPI_R2_PERIPHERALS=no bash build.sh current trixie minimal
if [[ "${EASEPI_R2_PERIPHERALS:-yes}" == "yes" ]]; then
	ENABLE_EXTENSIONS="${ENABLE_EXTENSIONS} easepi-r2-peripherals"
	PACKAGE_LIST_EXTRA="${PACKAGE_LIST_EXTRA} i2c-tools ir-keytable fonts-dejavu-core rfkill bluetooth bluez bluez-tools iproute2 iputils-ping ethtool bridge-utils dnsmasq nftables iptables ppp pppoe curl ca-certificates wpasupplicant hostapd libdrm2 libegl-mesa0 libgles2 libgl1-mesa-dri mesa-vulkan-drivers mesa-utils vulkan-tools kmscube glmark2-es2-drm v4l-utils"
fi

# Bluetooth HCI attach configuration for AP6255 module (ttyS9)
declare -g BLUETOOTH_HCIATTACH_PARAMS="-s 115200 /dev/ttyS9 bcm43xx 1500000"
declare -g BLUETOOTH_HCIATTACH_RKFILL_NUM="all"

function post_family_config__easepi-r2_use_mainline_uboot_except_vendor() {
	display_alert "$BOARD" "Configuring ($BOARD) standard target map" "info"
	UBOOT_TARGET_MAP="
	BL31=$RKBIN_DIR/$BL31_BLOB TEE=$RKBIN_DIR/$TEE_BLOB $BOOTCONFIG spl/u-boot-spl.bin u-boot.dtb u-boot.itb;;idbloader.img u-boot.itb"

	# use vendor uboot for _vendor_ branch
	if [[ "${BRANCH}" == "vendor" ]]; then
		display_alert "$BOARD" "Vendor U-Boot overrides for $BOARD - $BRANCH" "info"
		declare -g BOOTCONFIG="easepi-r2-rk3588_defconfig"
		declare -g BOOTDELAY=5
		# Vendor U-Boot uses rk35xx family's default setup (Radxa U-Boot)
		# No need to override BOOTSOURCE, BOOTBRANCH, BOOTPATCHDIR as they are defined in rk35xx.conf
		return 0
	fi

	# use mainline uboot for _current_ and _edge_
	display_alert "$BOARD" "Mainline U-Boot overrides for $BOARD - $BRANCH" "info"
	declare -g BOOTCONFIG="easepi-r2-rk3588_defconfig"
	declare -g BOOTDELAY=5
	declare -g BOOTSOURCE="https://github.com/u-boot/u-boot"
	declare -g BOOTBRANCH="tag:v2025.10"
	declare -g BOOTPATCHDIR="v2025.10"
	declare -g BOOTDIR="u-boot-${BOARD}"
	declare -g UBOOT_TARGET_MAP="BL31=${RKBIN_DIR}/${BL31_BLOB} ROCKCHIP_TPL=${RKBIN_DIR}/${DDR_BLOB};;u-boot-rockchip.bin"
	unset uboot_custom_postprocess write_uboot_platform write_uboot_platform_mtd # disable stuff from rockchip64_common; we're using binman here which does all the work already

	# Just use the binman-provided u-boot-rockchip.bin, which is ready-to-go
	function write_uboot_platform() {
		dd "if=$1/u-boot-rockchip.bin" "of=$2" bs=32k seek=1 conv=notrunc status=none
	}
}
